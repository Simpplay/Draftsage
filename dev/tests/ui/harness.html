<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Easy Coachless — arnés de pruebas</title></head>
<body style="background:#1a1c21;margin:0;height:100vh">
<script>
// Simula lo mínimo de Pengu Loader 1.1.6 y del cliente (LCU) + una API de Coachless falsa. SOLO para pruebas (dev/).
const store = new Map(JSON.parse(sessionStorage.getItem('ds') || '[]'))
window.DataStore = { get: (k, d) => (store.has(k) ? store.get(k) : d), set: (k, v) => { store.set(k, v); sessionStorage.setItem('ds', JSON.stringify([...store])) }, remove: (k) => { store.delete(k); sessionStorage.setItem('ds', JSON.stringify([...store])) } }
window.Toast = { success: (m) => (window.__toasts ??= []).push(m), error: (m) => (window.__toasts ??= []).push('ERR ' + m) }
window.openPluginsFolder = () => {}; window.restartClient = () => {}
window.__net = []       // peticiones a la API de Coachless (para comprobar filtros)
window.__lcu = { phase: 'None', session: null }
window.__writes = []   // escrituras al LCU (runas/hechizos)
window.__pages = [{ id: 1, name: 'Mi página', isEditable: true, current: true, selectedPerkIds: [1, 2, 3, 4, 5, 6, 7, 8, 9] }]
window.__maxPages = 3
const icon = (c, t) => 'data:image/svg+xml,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36"><circle cx="18" cy="18" r="16" fill="${c}"/><text x="18" y="22" font-size="10" text-anchor="middle" fill="#fff">${t}</text></svg>`)
const RUNES = { 8005: 'Ataque Rápido', 8021: 'Paso Veloz', 8008: 'Ritmo Letal', 9111: 'Triunfo', 9104: 'Leyenda: Presteza', 8017: 'Tajo', 8321: 'Reembolso', 8313: 'Momento Perfecto', 5005: 'Vel. ataque', 5008: 'Adaptable', 5011: 'Vida', 8000: 'Precisión', 8300: 'Inspiración' }
const ch = [[145, "Kai'Sa", 'Kaisa'], [222, 'Jinx', 'Jinx'], [103, 'Ahri', 'Ahri'], [238, 'Zed', 'Zed'], [412, 'Thresh', 'Thresh']]
window.__queue = { gameMode: 'CLASSIC', id: 420 } // modo de juego que informa el LCU (gameflow/session)
const jwt = (claims) => 'h.' + btoa(JSON.stringify(claims)).replace(/=+$/, '').replace(/\+/g, '-').replace(/\//g, '_') + '.s'
const j = (o, status = 200) => new Response(JSON.stringify(o), { status, headers: { 'content-type': 'application/json' } })
const e = (rune, w, n) => ({ rune, runeType: 0, wpaOverall: w, occurrence: n, runeEffects: [] })
window.__premium = false
window.__live = null // foto de allgamedata que devuelve el «juego» (null = sin partida)
window.__rankedTier = 'EMERALD'
const realFetch = window.fetch.bind(window)
window.fetch = async (url, init = {}) => {
  url = String(url); const body = init.body ? JSON.parse(init.body) : null
  if (url.startsWith('/lol-')) {
    await new Promise((r) => setTimeout(r, 20))
    const method = (init.method || 'GET').toUpperCase()
    if (method !== 'GET') window.__writes.push({ method, url, body })
    if (url === '/lol-perks/v1/pages' && method === 'GET') return j(window.__pages)
    if (url === '/lol-perks/v1/pages' && method === 'POST') { const p = { ...body, id: 50 + window.__pages.length, isEditable: true }; window.__pages.push(p); return j(p) }
    if (url.startsWith('/lol-perks/v1/pages/') && method === 'PUT') { Object.assign(window.__pages.find((p) => p.id === +url.split('/').pop()), body); return j({}) }
    if (url === '/lol-perks/v1/currentpage' && method === 'PUT') { window.__pages.forEach((p) => { p.current = p.id === body }); return j({}) }
    if (url === '/lol-perks/v1/inventory') return j({ ownedPageCount: window.__maxPages })
    if (url === '/lol-champ-select/v1/session/my-selection' && method === 'PATCH') return window.__rejectSpells ? j({}, 500) : j({})
    if (url === '/lol-gameflow/v1/gameflow-phase') return j(window.__lcu.phase)
    if (url === '/lol-gameflow/v1/session') return j({ gameData: { queue: window.__queue } })
    if (url === '/lol-champ-select/v1/session') return window.__lcu.session ? j(window.__lcu.session) : j({}, 404)
    if (url.startsWith('/lol-ranked/v1/ranked-stats/')) return j({ queueMap: { RANKED_SOLO_5x5: { tier: window.__rankedTier } } })
    if (url === '/lol-perks/v1/perks') return j(Object.entries(RUNES).map(([id, name]) => ({ id: +id, name, iconPath: icon('#785a28', id) })))
    if (url === '/lol-perks/v1/styles') return j([{ id: 8000, name: 'Precisión', iconPath: icon('#c8aa6e', 'P'), slots: [{ type: 'kKeyStone', perks: [8005, 8008, 8021, 8010] }] }])
    if (url.includes('summoner-spells')) return j([{ id: 4, name: 'Destello', iconPath: icon('#0ac8b9', 'F') }, { id: 3, name: 'Extenuación', iconPath: icon('#e84057', 'E') }, { id: 7, name: 'Curar', iconPath: icon('#3a9a4a', 'C') }, { id: 11, name: 'Aplastar', iconPath: icon('#c8aa6e', 'A') }])
    if (url.includes('/items.json')) return j([[1055, 'Hoja de Doran', 450, []], [1037, 'Pico', 875, []], [1042, 'Daga', 300, []], [3087, 'Filo Estático', 2600, [1037, 1042]], [3124, 'Hoja de Guinsoo', 3000, [1042, 1037]], [3006, 'Grebas de Berserker', 1100, [], ['Boots']], [3009, 'Botas de Rapidez', 900, [], ['Boots']], [3031, 'Filo del Infinito', 3450, [1037]], [3036, 'Lord Dominik', 3000, [1037]], [3026, 'Ángel Guardián', 3200, [1037]], [3139, 'Cimitarra Mercurial', 3300, [1037]], [3085, 'Huracán de Runaan', 2700, [1037]]]
      .map(([id, name, priceTotal, from, categories]) => ({ id, name, priceTotal, from, iconPath: icon('#4a3b78', String(id).slice(-2)), categories: categories ?? [] })))
    if (url.includes('champion-summary')) return j([{ id: -1, name: 'None' }, ...ch.map(([id, name, alias]) => ({ id, name, alias, squarePortraitPath: icon('#3c3c41', name[0]) }))])
    return j({}, 404)
  }
  if (url.startsWith('https://127.0.0.1:2999/liveclientdata/')) { // Live Client Data API: solo responde durante la partida
    if (!window.__live) throw new TypeError('Failed to fetch')
    return j(window.__live)
  }
  if (url.startsWith('https://api.coachless.gg/api/')) {
    const path = url.slice('https://api.coachless.gg/api/'.length)
    await new Promise((r) => setTimeout(r, 30))
    if (path === 'Auth/login') {
      return body.password === 'bad' ? j({ actionResult: 1, accessToken: null, refreshToken: null })
        : j({ actionResult: 0, accessToken: jwt({ exp: Math.floor(Date.now() / 1000) + 86400, isSubscribed: window.__premium ? '1' : '0', email: body.email }), refreshToken: 'refresh-token' })
    }
    if (path === 'Auth/refresh') return j({ accessToken: jwt({ exp: Math.floor(Date.now() / 1000) + 86400, isSubscribed: '0', email: 'a@b.c' }), refreshToken: 'refresh-token' })
    window.__net.push({ path, body, auth: !!init.headers?.Authorization })
    if (!init.headers?.Authorization) return j({}, 403)
    if (window.__forbidAll) return j({}, 403)
    if (path === 'ChampionWinprob/GetPatches') return j([19, 20, 21, 22].map((p) => ({ label: '16.' + p, major: 16, patch: p, matchCount: p === 22 ? 243088 : 6800000 })))
    if (path === 'Rune/GetKeystoneData') return j([e(8005, -2.6, 25723), e(8008, 0.16, 538163), e(8021, -1, 60000)])
    // Aplastar tiene el mejor WPA: las reglas de hechizos deben descartarlo fuera de la jungla.
    if (path === 'ChampionWinprob/GetGlobalSummonerSpellStatistics') {
      const S = [{ summonerSpell: 3, wpaOverall: 0.8, occurrence: 111000 }, { summonerSpell: 4, wpaOverall: 0, occurrence: 575000 }, { summonerSpell: 7, wpaOverall: -0.2, occurrence: 120000 }, { summonerSpell: 11, wpaOverall: 2.5, occurrence: 150000 }]
      return j(body.pairedSpell ? S.filter((s) => s.summonerSpell !== body.pairedSpell) : S)
    }
    if (path === 'ChampionWinprob/GetRecommendedBuilds') {
      const it = (itemId, wpa = 0, occurrence = 0, extra = {}) => ({ itemId, wpa, occurrence, chooseOne: false, highlighted: false, ...extra })
      return j({ role: 3, builds: [{ keystone: 8008, runes: { primaryTree: 8000, secondaryTree: 8300, selectedRunes: [], selectedShards: [5005, 5008, 5011] }, occurrence: 67479, tier: 0, winrate: 51.28, mostPopular: true,
        starterIds: [1055], firstItemId: 3087, secondItemId: 3124,
        itemBlocks: [
          { type: 0, items: [it(1055, 0, 0, { chooseOne: true })] },
          { type: 1, items: [it(3006, 0.4, 30000), it(1055, 0.1, 25000)] },
          { type: 2, items: [it(3087, 0.9, 60000), it(3006, 0.5, 58000), it(3124, 0.6, 50000)] },
          { type: 3, items: [it(3124, 0.6, 50000, { chooseOne: true }), it(3085, 0.2, 9000, { chooseOne: true })] },
          { type: 4, items: [it(3139, 0.3, 4000), it(3036, 0.8, 20000, { highlighted: true }), it(3026, 0.1, 15000)] },
        ] }], spellDuos: [] })
    }
    if (path === 'ChampionWinprob/GetGlobalItemStatistics') {
      const st = (itemId, w, n) => ({ itemId, wpaOverall: w, occurrenceRelative: 0, winrateExpected: 50, winrateObserved: 50, occurrence: n })
      return j(body.itemType === 2 ? [st(3009, -0.3, 40000), st(3006, 0.6, 200000)] : body.itemSlots?.join() === '3' ? [st(3031, 1.2, 80000), st(3036, 0.4, 60000), st(3026, -0.2, 50000)] : [])
    }
    if (path === 'Rune/GetRunesForKeystoneAndTree') {
      const main = body.mainTree === body.treeToLoad
      return j(main ? { rowOnes: [e(8009, -0.4, 400000), e(9111, 1.1, 150000)], rowTwos: [e(9104, 0.77, 65000), e(9103, -0.1, 497000)], rowThrees: [e(8017, 0.6, 190000), e(8014, -0.3, 360000)] }
        : body.treeToLoad === 8300 ? { rowOnes: [e(8321, 0.7, 300000)], rowTwos: [e(8313, 0.8, 148000)], rowThrees: [] } : { rowOnes: [], rowTwos: [], rowThrees: [] })
    }
    return j({}, 404)
  }
  return realFetch(url, init)
}
window.__start = async () => { const m = await import('/index.js'); return m.load() }
</script></body></html>
